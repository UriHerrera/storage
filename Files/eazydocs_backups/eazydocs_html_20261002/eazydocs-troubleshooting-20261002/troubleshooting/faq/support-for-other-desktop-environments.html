<p>By default, Nitrux uses Hyprland, Waybar, and Crystal Dock to put together the desktop. However, users can install alternative desktop environments or window managers using Distrobox or by creating an AppBox.</p>

<h3>Information</h3>

<p>For a detailed tutorial on the process, see <a href="https://nxos.org/documentation/resources/tutorials/">Resources → Tutorials → Desktop</a>.</p>
